workflows:
  build_bitchat_ios:
    name: Build Bitchat (No Signing)
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        APP_SCHEME: "bitchat"
        APP_PROJECT: "bitchat.xcodeproj"
    scripts:
      - name: Install tools
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Remove broken Config.xcconfig references
        script: |
          sed -i '' '/configFiles/d' project.yml || true
          xcodegen generate
      - name: Build iOS app without signing
        script: |
          xcodebuild \
            -project $APP_PROJECT \
            -scheme $APP_SCHEME \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/**/*.app
      - /tmp/xcodebuild_logs/*.log
