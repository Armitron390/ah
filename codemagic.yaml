workflows:
  build_bitchat_ios:
    name: Build Bitchat iOS (No Signing)
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        APP_PROJECT: "bitchat.xcodeproj"
    scripts:
      - name: Install tools
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: List available Xcode schemes
        script: |
          echo "Available schemes:"
          xcodebuild -list -project $APP_PROJECT
      - name: Build iOS app without signing
        script: |
          xcodebuild \
            -project $APP_PROJECT \
            -scheme "bitchat (iOS)" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/**/*.app
      - /tmp/xcodebuild_logs/*.log
